
name: Trivy SCA Security Scan

# 监听代码提交和 Pull Request
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. 拉取 GitHub 仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 使用 Trivy 扫描 Maven 依赖
      - name: Run Trivy SCA Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: sca-report.json
          exit-code: '0'

      # 3. 将 JSON 报告转换成 HTML
      - name: Generate HTML Report
        run: |
          trivy convert \
            --format template \
            --template "@$HOME/.local/bin/trivy-bin/contrib/html.tpl" \
            --output sca-report.html \
            sca-report.json

      # 4. 上传检测报告
      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-reports
          path: |
            sca-report.json
            sca-report.html
          if-no-files-found: warn
          retention-days: 30
