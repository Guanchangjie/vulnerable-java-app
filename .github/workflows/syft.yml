
name: Syft SBOM Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取项目代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Syft
      - name: Install Syft
        run: |
          curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin
          syft version

      # 3. 生成 CycloneDX JSON
      - name: Generate SBOM JSON
        run: |
          syft dir:. -o cyclonedx-json=sbom-report.json

      # 4. 配置 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. 执行 JSON 转 HTML
      - name: Convert JSON to HTML
        run: |
          python sbom_to_html.py

      # 6. 上传报告
      - name: Upload SBOM Reports
        uses: actions/upload-artifact@v4
        with:
          name: SBOM-Reports
          path: |
            sbom-report.json
            sbom-report.html
          retention-days: 30
